name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t raj-task-api:ci .

              - name: Start container and check health
        run: |
          docker run -d --name task-api-ci -p 127.0.0.1:8001:8000 raj-task-api:ci
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8001/health

      - name: Show container logs
        if: always()
        run: docker logs task-api-ci

      - name: Remove test container
        if: always()
        run: docker rm -f task-api-ci